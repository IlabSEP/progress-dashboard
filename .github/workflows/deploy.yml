name: Build and deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per branch, so a dev push never cancels a main deploy.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    # main → prod (GitHub Pages), anything else → dev (Cloudflare Pages).
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - if: github.ref_name == 'main'
        run: npm run build
      - if: github.ref_name == 'main'
        uses: actions/configure-pages@v5
      - if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Cloudflare serves from the root, and its built-in SPA fallback only
      # kicks in when there is no 404.html (that file is the GitHub Pages workaround).
      - if: github.ref_name != 'main'
        run: npm run build -- --base=/ && rm dist/404.html
      - if: github.ref_name != 'main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=progress-dashboard-dev --branch=dev

  deploy:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
